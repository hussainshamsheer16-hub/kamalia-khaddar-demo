<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Checkout · Kamalia Khaddar</title><link rel="stylesheet" href="style.css"><link rel="stylesheet" href="admin-common.css"><style>.checkout-shell{max-width:1100px;margin:40px auto;padding:20px;display:grid;grid-template-columns:1.2fr .8fr;gap:25px}.checkout-card{background:white;border:1px solid #e9e1d7;border-radius:12px;padding:25px}.checkout-card h2{font:600 28px 'Playfair Display',serif;margin:8px 0 20px}.checkout-items{display:grid;gap:12px}.checkout-line{display:flex;gap:12px;align-items:center;border-bottom:1px solid #eee;padding-bottom:12px}.checkout-line img{width:64px;height:76px;object-fit:cover}.checkout-line div{flex:1}.checkout-line small{display:block;color:#85796d}.checkout-total{display:flex;justify-content:space-between;padding-top:16px;font-weight:700}.checkout-form{display:grid;grid-template-columns:1fr 1fr;gap:12px}.checkout-form input,.checkout-form select,.checkout-form textarea{width:100%;padding:13px;border:1px solid #e9e1d7;border-radius:7px;background:white}.checkout-form .wide{grid-column:1/-1}.checkout-form button{background:#493326;color:white;padding:14px;border:0;border-radius:7px;cursor:pointer}.checkout-head{max-width:1100px;margin:30px auto 0;padding:0 20px;display:flex;justify-content:space-between;align-items:center}.checkout-head a{color:#493326}@media(max-width:750px){.checkout-shell{grid-template-columns:1fr;margin:10px auto}.checkout-form{grid-template-columns:1fr}.checkout-form .wide{grid-column:auto}}</style></head><body><header class="checkout-head"><a href="index.html" style="font:600 22px 'Playfair Display',serif;letter-spacing:2px;text-decoration:none">KAMALIA KHADDAR</a><a href="index.html">← Continue shopping</a></header><main class="checkout-shell"><section class="checkout-card"><p class="eyebrow">Secure your order</p><h2>Customer details</h2><form id="checkoutForm" class="checkout-form"><input name="name" placeholder="Full name" required><input name="phone" placeholder="Phone number" required><input name="email" type="email" placeholder="Email address"><input name="city" placeholder="City" required><textarea class="wide" name="address" placeholder="Complete delivery address" rows="3" required></textarea><select class="wide" name="payment" required><option value="Cash on Delivery">Cash on Delivery</option><option value="Bank Transfer">Bank Transfer (demo)</option><option value="JazzCash">JazzCash (demo)</option><option value="EasyPaisa">EasyPaisa (demo)</option></select><p class="wide" style="font-size:12px;color:#85796d">Online payment methods are demo selections only. No money is collected in this prototype.</p><button class="wide" type="submit">Place order</button></form><p id="checkoutMessage" style="margin-top:15px"></p></section><aside class="checkout-card"><p class="eyebrow">Your order</p><h2>Order summary</h2><div id="checkoutItems" class="checkout-items"></div><div class="checkout-total"><span>Total</span><span id="checkoutTotal">PKR 0</span></div></aside></main><script src="backend.js"></script><script src="checkout.js"></script></body></html>
